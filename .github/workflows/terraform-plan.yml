name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main

env:
  TF_VERSION: '1.10.5'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan_infra:
    name: "01 - Plan Infra & Database"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./foundation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/686738806484/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider'
          service_account: 'github-actions@modern-nation-510807-e9.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create tfvars
        env:
          RAW_TFVARS: ${{ secrets.TFVARS_FILE }}
        run: |
          printf "%s\n" "$RAW_TFVARS" > terraform.tfvars

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -upgrade

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan (Infra)
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Infra Plan to PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let planText = '';
            try {
              planText = fs.readFileSync('./02-repo-infra/plan_output.txt', 'utf8');
              if (planText.length > 60000) {
                planText = planText.substring(0, 60000) + '\n... [Plan output truncated]';
              }
            } catch (err) {
              planText = 'Could not read plan output: ' + err.message;
            }

            const output = `#### 🏗️ Thursday-GKE Infrastructure Plan 📖
            * **Format:** ${{ steps.fmt.outcome }} | **Init:** ${{ steps.init.outcome }} | **Plan:** ${{ steps.plan.outcome }}

            <details><summary>Show Infrastructure Plan</summary>

            \`\`\`hcl
            ${planText}
            \`\`\`

            </details>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if Infra Plan Failed
        if: steps.plan.outcome != 'success'
        run: exit 1
  plan_app:
    name: "02 - Plan GKE Workloads & Route"
    needs: [plan_infra]
    runs-on: [self-hosted, thursday-app-runner]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create tfvars
        env:
          RAW_TFVARS: ${{ secrets.TFVARS_FILE }}
        run: |
          printf "%s\n" "$RAW_TFVARS" > terraform.tfvars

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (App Deploy)
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post App Plan to PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let planText = '';
            try {
              planText = fs.readFileSync('./03-app-deployment/plan_output.txt', 'utf8');
              if (planText.length > 60000) {
                planText = planText.substring(0, 60000) + '\n... [Plan output truncated]';
              }
            } catch (err) {
              planText = 'Could not read plan output: ' + err.message;
            }

            const output = `#### 🚀 Thursday-GKE Kubernetes Deployment Plan 📖
            * **Plan Status:** ${{ steps.plan.outcome }}

            <details><summary>Show Workload Deployment Plan</summary>

            \`\`\`hcl
            ${planText}
            \`\`\`

            </details>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if App Plan Failed
        if: steps.plan.outcome != 'success'
        run: exit 1